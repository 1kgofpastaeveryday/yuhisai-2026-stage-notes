<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roadmap Viewer</title>
  <meta name="description" content="JSON driven roadmap viewer.">
  <style>
    :root {
      color-scheme: light;
      --ink: #172026;
      --muted: #5a6670;
      --subtle: #eef2f5;
      --line: #d8e0e6;
      --panel: #ffffff;
      --accent: #0d7f7b;
      --accent-2: #3268a8;
      --warn: #a16612;
      --research: #6b5c7a;
      --bg: #f7f9fa;
      --shadow: 0 18px 45px rgba(25, 36, 45, .08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.6;
      letter-spacing: 0;
    }

    .hero {
      background: #122126;
      color: #f8fbfb;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(120deg, rgba(13, 127, 123, .34), transparent 45%),
        radial-gradient(circle at 82% 18%, rgba(255, 255, 255, .10), transparent 24%);
      pointer-events: none;
    }

    .hero-inner {
      position: relative;
      max-width: 1160px;
      margin: 0 auto;
      padding: 46px 20px 34px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 36px;
      align-items: end;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #b9d9d5;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 820px;
      font-size: clamp(38px, 6vw, 72px);
      line-height: .98;
      letter-spacing: 0;
    }

    h2 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0;
    }

    h3 {
      letter-spacing: 0;
    }

    .lead {
      max-width: 760px;
      margin: 18px 0 0;
      color: #d6e2e1;
      font-size: 17px;
    }

    .hero-note,
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 24px 0 0;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 6px 11px;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 999px;
      color: #e9f2f1;
      background: rgba(255, 255, 255, .08);
      font-size: 13px;
      white-space: nowrap;
    }

    .status-visual {
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .18);
    }

    .signal-row {
      display: grid;
      grid-template-columns: 96px 1fr 44px;
      gap: 10px;
      align-items: center;
      margin: 12px 0;
      color: #edf5f4;
      font-size: 13px;
    }

    .bar,
    .progress {
      height: 9px;
      background: var(--subtle);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar { background: rgba(255, 255, 255, .14); height: 10px; }
    .progress { margin-top: 8px; }

    .bar > span,
    .progress > span {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
    }

    .progress.design > span { background: var(--accent-2); }

    .hero-caption {
      margin: 12px 0 0;
      color: #b9c8c6;
      font-size: 12px;
    }

    main {
      max-width: 1160px;
      margin: 0 auto;
      padding: 30px 20px 64px;
    }

    .section-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: end;
      margin: 34px 0 16px;
    }

    .section-copy {
      margin: 6px 0 0;
      color: var(--muted);
      max-width: 820px;
    }

    .updated {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .grid,
    .issues {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .issues { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    .card,
    .feature {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .card { padding: 18px; }

    .card h3 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .card p,
    .evidence,
    .detail-panel p,
    .detail-panel li,
    .issue-list li {
      color: var(--muted);
      font-size: 14px;
    }

    .metric-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      margin-top: 14px;
      font-size: 13px;
      color: var(--muted);
    }

    .metric-row strong {
      color: var(--ink);
      font-size: 18px;
    }

    .roadmap {
      display: grid;
      gap: 14px;
    }

    .feature {
      overflow: hidden;
    }

    .feature summary {
      display: grid;
      grid-template-columns: minmax(220px, 1.1fr) minmax(0, 1.6fr) 168px 168px 28px;
      gap: 18px;
      align-items: center;
      padding: 16px;
      cursor: pointer;
      list-style: none;
    }

    .feature summary::-webkit-details-marker { display: none; }

    .feature summary::after {
      content: "+";
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
    }

    .feature[open] summary::after { content: "-"; }

    .feature h3 {
      margin: 0 0 4px;
      font-size: 17px;
    }

    .meta {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      margin-bottom: 8px;
      padding: 3px 8px;
      border-radius: 999px;
      color: #fff;
      background: var(--accent);
      font-size: 12px;
      font-weight: 700;
      text-transform: capitalize;
    }

    .tag.alpha { background: var(--warn); }
    .tag.planned { background: var(--accent-2); }
    .tag.exploring { background: var(--research); }

    .evidence {
      margin: 0;
    }

    .evidence strong {
      color: var(--ink);
      font-weight: 700;
    }

    .score label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .score b {
      color: var(--ink);
      font-size: 13px;
    }

    .feature-body {
      border-top: 1px solid var(--line);
      padding: 16px;
      background: #fbfcfd;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .detail-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 14px;
    }

    .detail-panel h4 {
      margin: 0 0 8px;
      font-size: 13px;
      color: var(--ink);
      letter-spacing: 0;
    }

    .detail-panel p { margin: 0; }
    .detail-panel ul { margin: 0; padding-left: 18px; }
    .detail-panel li + li { margin-top: 6px; }

    .legend {
      margin: 0 0 22px;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
    }

    .dot.alpha { background: var(--warn); }
    .dot.planned { background: var(--accent-2); }
    .dot.exploring { background: var(--research); }

    .issue-list {
      margin: 12px 0 0;
      padding: 0;
      list-style: none;
    }

    .issue-list li {
      padding: 11px 0;
      border-top: 1px solid var(--line);
    }

    .issue-list strong { color: var(--ink); }

    .principles,
    .load-error {
      background: #e9f3f1;
      border: 1px solid #c9dfdc;
      border-radius: 8px;
      padding: 18px;
      margin-top: 18px;
    }

    .load-error {
      background: #fff7e8;
      border-color: #ead4ad;
    }

    .file-input {
      margin-top: 12px;
    }

    .active-task {
      margin: 22px 0 8px;
      padding: 20px 22px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fff;
      box-shadow: var(--shadow);
      border-left: 6px solid var(--accent);
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }

    .active-task:hover { border-color: var(--accent); }

    .active-task.idle {
      border-left-color: #b0bac2;
      background: #f4f6f8;
      opacity: .82;
    }

    .active-task-head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 8px;
    }

    .active-task-eyebrow {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .active-task.idle .active-task-eyebrow { color: var(--muted); }

    .live-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 rgba(13, 127, 123, .5);
      animation: pulse 1.8s infinite;
    }

    .active-task.idle .live-dot { background: #b0bac2; animation: none; }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(13, 127, 123, .45); }
      70% { box-shadow: 0 0 0 8px rgba(13, 127, 123, 0); }
      100% { box-shadow: 0 0 0 0 rgba(13, 127, 123, 0); }
    }

    .active-task h2 {
      font-size: 24px;
      margin: 2px 0 6px;
    }

    .active-task .at-phase {
      margin: 0 0 4px;
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
    }

    .active-task .at-note {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .active-task-foot {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }

    .at-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 11px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 12px;
      color: #fff;
      background: var(--accent);
    }

    .active-task.idle .at-badge { background: #8b96a0; }

    .at-jump {
      margin-left: auto;
      padding: 7px 14px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    .at-jump:hover { filter: brightness(1.06); }
    .active-task.idle .at-jump { background: #8b96a0; border-color: #8b96a0; }

    .feature-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 14px 0 4px;
    }

    .feature-nav .nav-label {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-right: 4px;
    }

    .nav-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }

    .nav-chip:hover { border-color: var(--accent); background: var(--subtle); }
    .nav-chip.is-active { border-color: var(--accent); background: rgba(13, 127, 123, .1); font-weight: 700; }
    .nav-chip .chip-pct { color: var(--muted); font-size: 12px; }

    @media (max-width: 940px) {
      .hero-inner,
      .grid,
      .issues,
      .detail-grid {
        grid-template-columns: 1fr;
      }

      .status-visual { max-width: 520px; }
      .feature summary { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .hero-inner { padding-top: 34px; }
      .section-head { grid-template-columns: 1fr; }
      h1 { font-size: 42px; }
      h2 { font-size: 24px; }
      .pill,
      .updated { white-space: normal; }
    }

    .stage-badge {
      display: inline-block; padding: .1rem .55rem; border-radius: 999px;
      font-size: .78rem; font-weight: 700; letter-spacing: .02em;
      background: rgba(120, 220, 210, .16); border: 1px solid rgba(120, 220, 210, .45);
    }
    .stage-track { display: inline-flex; gap: 4px; align-items: center; }
    .stage-track i {
      width: 14px; height: 8px; border-radius: 3px;
      background: rgba(255, 255, 255, .14); display: inline-block;
    }
    .stage-track i.past { background: rgba(120, 220, 210, .45); }
    .stage-track i.now { background: rgba(120, 220, 210, .95); }
    .stage-def { font-size: .74rem; opacity: .65; margin: .25rem 0 0; }
  </style>
</head>
<body>
  <div id="app">
    <main>
      <section class="load-error">
        <h1>Roadmap Viewer</h1>
        <p>Loading <code>roadmap.json</code>...</p>
      </section>
    </main>
  </div>

  <script type="application/json" id="embedded-roadmap-data">
{
  "project": "ProjectName",
  "title": "ProjectName Developer Roadmap",
  "updated_at": "YYYY-MM-DD",
  "active_task": {
    "feature_id": "example-feature",
    "phase": "Short phase label, e.g. 'design locked → implementing'.",
    "note": "One line on what is being worked on right now.",
    "updated_at": "YYYY-MM-DDTHH:MM:SS+09:00",
    "idle_abandon_hours": 3
  },
  "summary": "Private developer roadmap. Track what exists, what is designed, what is unfinished, and what should be built next.",
  "scoring_policy": "Progress is an evidence-based maturity `stage`, not a percentage. Each stage is defined by a checkable criterion (see `stages`). Raise a stage only when the criterion is met, and record the observed evidence in the feature changelog. Never invent numeric progress figures.",
  "overview": [
    {
      "label": "Core",
      "stage": "not-started"
    },
    {
      "label": "UX",
      "stage": "not-started"
    },
    {
      "label": "Reliability",
      "stage": "not-started"
    },
    {
      "label": "Release readiness",
      "stage": "not-started"
    }
  ],
  "status_labels": {
    "available": "内部検証で使用可能",
    "alpha": "動くが荒い",
    "planned": "設計先行",
    "exploring": "検討中"
  },
  "snapshot": [
    {
      "name": "Example feature group",
      "description": "Summarize the current real state in one sentence.",
      "stage": "not-started"
    }
  ],
  "features": [
    {
      "id": "example-feature",
      "name": "Example feature",
      "status": "planned",
      "summary": "Short purpose or user-visible capability.",
      "done": [],
      "remaining_issues": [],
      "current_state": "Current reality. Be concrete and harsh.",
      "next_actions": [],
      "changelog": [
        {
          "date": "YYYY-MM-DD",
          "implementation": "initial -> 0%",
          "design": "initial -> 0%",
          "reason": "Initial roadmap entry."
        }
      ],
      "stage": "not-started"
    }
  ],
  "priorities": [
    {
      "title": "Next highest-leverage task",
      "description": "Why this is the next thing to do."
    }
  ],
  "not_ready_claims": [
    {
      "title": "Claim that must not be made yet",
      "description": "Why the project cannot honestly claim this yet."
    }
  ],
  "stages": {
    "not-started": "コードが存在しない（設計メモのみは可）",
    "spike": "動くコードはあるが実運用実績なし（使い捨て検証・ベンチ・PoCのみ）",
    "prototype": "実データ・実運用で最低1回動いた実績がある",
    "internal": "開発者自身が複数日にわたり繰り返し実運用している",
    "usable": "開発者以外がドキュメントどおりにセットアップして使える",
    "hardened": "公開運用に耐える（実認証・監視・障害復旧・コスト管理）"
  }
}
</script>

  <script>
    const app = document.getElementById("app");
    const statusOrder = ["available", "alpha", "planned", "exploring"];

    const escapeHtml = (value) => String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

    const pct = (value) => {
      const n = Number(value ?? 0);
      return Math.max(0, Math.min(100, Number.isFinite(n) ? n : 0));
    };

    // Evidence-based maturity stages (replaces percentages when `stage` is present).
    const STAGE_ORDER = ["not-started", "spike", "prototype", "internal", "usable", "hardened"];
    const stageIndex = (stage) => STAGE_ORDER.indexOf(stage);
    const stageDef = (data, stage) => (data && data.stages && data.stages[stage]) || "";
    const stageTrack = (stage) => {
      const idx = stageIndex(stage);
      if (idx < 0) return "";
      return `<span class="stage-track" role="img" aria-label="stage ${escapeHtml(stage)}">${
        STAGE_ORDER.map((name, i) =>
          `<i class="${i < idx ? "past" : i === idx ? "now" : ""}" title="${escapeHtml(name)}"></i>`
        ).join("")
      }</span>`;
    };
    const stageBadge = (stage) => `<span class="stage-badge stage-${escapeHtml(stage)}">${escapeHtml(stage)}</span>`;

    const list = (items) => {
      const values = Array.isArray(items) ? items : [];
      if (!values.length) return "<p>未設定</p>";
      return `<ul>${values.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`;
    };

    const progress = (value, kind = "") =>
      `<div class="progress ${kind}"><span style="width: ${pct(value)}%"></span></div>`;

    const renderChangelog = (items) => {
      const values = Array.isArray(items) ? items.slice(0, 3) : [];
      if (!values.length) return "<p>未記録</p>";
      return `<ul>${values.map((item) => {
        const parts = [
          item.date,
          item.stage ? `Stage: ${item.stage}` : "",
          item.implementation ? `Implementation: ${item.implementation}` : "",
          item.design ? `Design: ${item.design}` : "",
          item.reason || ""
        ].filter(Boolean).join(" / ");
        return `<li>${escapeHtml(parts)}</li>`;
      }).join("")}</ul>`;
    };

    const fmtDuration = (ms) => {
      const totalMin = Math.max(0, Math.floor(ms / 60000));
      const h = Math.floor(totalMin / 60);
      const m = totalMin % 60;
      if (h > 0) return `${h}時間${m}分`;
      return `${m}分`;
    };

    // Holds the active task so the live ticker can recompute idle state on a timer.
    let activeTaskState = null;

    const computeActiveTaskView = (task, features) => {
      if (!task || !task.feature_id) return null;
      const feature = (features || []).find((f) => f.id === task.feature_id);
      if (!feature) return null;
      const idleHours = Number(task.idle_abandon_hours) > 0 ? Number(task.idle_abandon_hours) : 3;
      const idleMs = idleHours * 3600000;
      const updatedMs = Date.parse(task.updated_at);
      const hasTime = Number.isFinite(updatedMs);
      const elapsed = hasTime ? Date.now() - updatedMs : null;
      const idle = hasTime ? elapsed >= idleMs : false;
      let status;
      if (!hasTime) {
        status = "更新時刻なし";
      } else if (idle) {
        status = `${fmtDuration(elapsed)}アイドル — 放棄扱い`;
      } else {
        status = `${fmtDuration(elapsed)}前に更新 · あと${fmtDuration(idleMs - elapsed)}でアイドル放棄`;
      }
      return { feature, idle, status, idleHours };
    };

    const renderActiveTask = (data) => {
      const view = computeActiveTaskView(data.active_task, data.features);
      if (!view) return "";
      const { feature, idle, status, idleHours } = view;
      const badge = idle ? "アイドル" : "作業中";
      return `
        <section
          class="active-task ${idle ? "idle" : ""}"
          id="active-task-card"
          role="button"
          tabindex="0"
          data-feature="${escapeHtml(feature.id)}"
          aria-label="いま作業中のタスク: ${escapeHtml(feature.name)}">
          <div class="active-task-head">
            <span class="live-dot"></span>
            <span class="active-task-eyebrow">いま作業中</span>
            <span class="at-badge">${badge}</span>
          </div>
          <h2>${escapeHtml(feature.name)}</h2>
          <p class="at-phase">${escapeHtml(data.active_task.phase || feature.summary || "")}</p>
          <p class="at-note">${escapeHtml(data.active_task.note || "")}</p>
          <div class="active-task-foot">
            <span id="active-task-status">${escapeHtml(status)}</span>
            <span>${feature.stage ? `成熟度 ${escapeHtml(feature.stage)}` : `実装率 ${pct(feature.implementation_percent)}% · 設計率 ${pct(feature.design_percent)}%`}</span>
            <span>アイドル放棄しきい値: ${idleHours}時間</span>
            <button type="button" class="at-jump" data-feature="${escapeHtml(feature.id)}">この機能を開く →</button>
          </div>
        </section>`;
    };

    const refreshActiveTaskStatus = () => {
      if (!activeTaskState) return;
      const card = document.getElementById("active-task-card");
      const statusEl = document.getElementById("active-task-status");
      if (!card || !statusEl) return;
      const view = computeActiveTaskView(activeTaskState.task, activeTaskState.features);
      if (!view) return;
      statusEl.textContent = view.status;
      card.classList.toggle("idle", view.idle);
      const badge = card.querySelector(".at-badge");
      if (badge) badge.textContent = view.idle ? "アイドル" : "作業中";
    };

    const renderFeatureNav = (data) => {
      const features = Array.isArray(data.features) ? data.features : [];
      if (!features.length) return "";
      const activeId = data.active_task && data.active_task.feature_id;
      const chips = features.map((f) => `
        <button type="button" class="nav-chip ${f.id === activeId ? "is-active" : ""}" data-feature="${escapeHtml(f.id)}">
          ${escapeHtml(f.name)}<span class="chip-pct">${f.stage ? escapeHtml(f.stage) : pct(f.implementation_percent) + "%"}</span>
        </button>`).join("");
      return `<nav class="feature-nav" aria-label="機能へジャンプ"><span class="nav-label">機能へジャンプ</span>${chips}</nav>`;
    };

    const jumpToFeature = (featureId) => {
      const target = document.getElementById(`feature-${featureId}`);
      if (!target) return;
      target.open = true;
      target.scrollIntoView({ behavior: "smooth", block: "center" });
    };

    // Single delegated handler covers the active-task card, its button, and every nav chip.
    let jumpControlsWired = false;
    const wireJumpControls = () => {
      if (jumpControlsWired) return;
      jumpControlsWired = true;
      app.addEventListener("click", (e) => {
        const trigger = e.target.closest("[data-feature]");
        if (!trigger) return;
        jumpToFeature(trigger.dataset.feature);
      });
      app.addEventListener("keydown", (e) => {
        if (e.key !== "Enter" && e.key !== " ") return;
        const card = e.target.closest(".active-task[data-feature]");
        if (!card) return;
        e.preventDefault();
        jumpToFeature(card.dataset.feature);
      });
    };

    const renderFeature = (feature, index) => {
      const status = feature.status || "planned";
      const done = Array.isArray(feature.done) ? feature.done.join("、") : "";
      const remaining = Array.isArray(feature.remaining_issues) ? feature.remaining_issues.join("、") : "";
      return `
        <details class="feature" id="feature-${escapeHtml(feature.id || index)}" ${index < 2 ? "open" : ""}>
          <summary>
            <div>
              <span class="tag ${escapeHtml(status)}">${escapeHtml(status)}</span>
              <h3>${escapeHtml(feature.name)}</h3>
              <p class="meta">${escapeHtml(feature.summary)}</p>
            </div>
            <p class="evidence"><strong>できている:</strong> ${escapeHtml(done || "未設定")}<br><strong>残課題:</strong> ${escapeHtml(remaining || "未設定")}</p>
            ${feature.stage ? `
            <div class="score">
              <label>成熟度 ${stageBadge(feature.stage)}</label>
              ${stageTrack(feature.stage)}
              <p class="stage-def">${escapeHtml(stageDef(window.__roadmapData, feature.stage))}</p>
            </div>` : `
            <div class="score">
              <label>実装率 <b>${pct(feature.implementation_percent)}%</b></label>
              ${progress(feature.implementation_percent)}
            </div>
            <div class="score">
              <label>設計率 <b>${pct(feature.design_percent)}%</b></label>
              ${progress(feature.design_percent, "design")}
            </div>`}
          </summary>
          <div class="feature-body">
            <div class="detail-grid">
              <div class="detail-panel"><h4>Current state</h4><p>${escapeHtml(feature.current_state || "未設定")}</p></div>
              <div class="detail-panel"><h4>Next actions</h4>${list(feature.next_actions)}</div>
              <div class="detail-panel"><h4>Changelog</h4>${renderChangelog(feature.changelog)}</div>
            </div>
          </div>
        </details>`;
    };

    const renderIssueList = (items) => {
      const values = Array.isArray(items) ? items : [];
      return `<ul class="issue-list">${values.map((item, i) =>
        `<li><strong>${i + 1}. ${escapeHtml(item.title)}:</strong> ${escapeHtml(item.description)}</li>`
      ).join("")}</ul>`;
    };

    const render = (data) => {
      window.__roadmapData = data;
      document.title = data.title || `${data.project || "Project"} Roadmap`;
      const labels = data.status_labels || {};
      const overview = Array.isArray(data.overview) ? data.overview : [];
      const snapshot = Array.isArray(data.snapshot) ? data.snapshot : [];
      const features = Array.isArray(data.features) ? data.features : [];
      app.innerHTML = `
        <div class="page">
          <header class="hero">
            <div class="hero-inner">
              <div>
                <p class="eyebrow">Public Product Roadmap</p>
                <h1>${escapeHtml(data.project || "Project")}は、できていることも未完の課題も公開します。</h1>
                <p class="lead">${escapeHtml(data.summary || "")}</p>
                <div class="hero-note" aria-label="Roadmap summary">
                  ${statusOrder.filter((key) => labels[key]).map((key) =>
                    `<span class="pill">${escapeHtml(key)}: ${escapeHtml(labels[key])}</span>`
                  ).join("")}
                </div>
              </div>
              <aside class="status-visual" aria-label="Current readiness overview">
                ${overview.map((item) => `
                  <div class="signal-row">
                    <span>${escapeHtml(item.label)}</span>
                    ${item.stage ? stageTrack(item.stage) : `<div class="bar"><span style="width: ${pct(item.percent)}%"></span></div>`}
                    <b>${item.stage ? escapeHtml(item.stage) : pct(item.percent) + "%"}</b>
                  </div>
                `).join("")}
                <p class="hero-caption">${escapeHtml(data.updated_at)}時点。JSONをtruth sourceにした暫定評価。</p>
              </aside>
            </div>
          </header>

          <main>
            ${renderActiveTask(data)}
            ${renderFeatureNav(data)}
            <section aria-labelledby="snapshot-title">
              <div class="section-head">
                <div>
                  <h2 id="snapshot-title">現在地</h2>
                  <p class="section-copy">${escapeHtml(data.scoring_policy || "")}</p>
                </div>
                <div class="updated">最終更新: ${escapeHtml(data.updated_at || "")}</div>
              </div>
              <div class="grid">
                ${snapshot.map((item) => `
                  <article class="card">
                    <h3>${escapeHtml(item.name)}</h3>
                    <p>${escapeHtml(item.description)}</p>
                    ${item.stage ? `
                    <div class="metric-row"><span>成熟度</span><strong>${escapeHtml(item.stage)}</strong></div>
                    ${stageTrack(item.stage)}` : `
                    <div class="metric-row"><span>実装率</span><strong>${pct(item.implementation_percent)}%</strong></div>
                    ${progress(item.implementation_percent)}`}
                  </article>
                `).join("")}
              </div>
            </section>

            <section aria-labelledby="roadmap-title">
              <div class="section-head">
                <div>
                  <h2 id="roadmap-title">機能別ロードマップ</h2>
                  <p class="section-copy">各featureを開くと、現在の状態、次の作業、直近のchangelogが確認できます。</p>
                </div>
              </div>
              <div class="legend" aria-label="Status legend">
                ${statusOrder.filter((key) => labels[key]).map((key) =>
                  `<span><i class="dot ${escapeHtml(key)}"></i>${escapeHtml(key)}: ${escapeHtml(labels[key])}</span>`
                ).join("")}
              </div>
              <div class="roadmap">
                ${features.map(renderFeature).join("")}
              </div>
            </section>

            <section aria-labelledby="issues-title">
              <div class="section-head">
                <div>
                  <h2 id="issues-title">優先して潰す課題</h2>
                  <p class="section-copy">ロードマップの数字を上げるために、今もっとも効く作業です。</p>
                </div>
              </div>
              <div class="issues">
                <article class="card">
                  <h3>次に手をつけるべきもの</h3>
                  ${renderIssueList(data.priorities)}
                </article>
                <article class="card">
                  <h3>まだ公開時に言い切らないもの</h3>
                  ${renderIssueList(data.not_ready_claims)}
                </article>
              </div>
              <div class="principles">
                <p>公開時の約束: 予定日は、実装に着手して検証できたものだけに付けます。それ以外はPlannedまたはExploringとして、期待値を上げすぎず、進捗を透明に更新します。</p>
              </div>
            </section>
          </main>
        </div>`;

      activeTaskState = { task: data.active_task, features: data.features };
      wireJumpControls();
      refreshActiveTaskStatus();
    };

    // Recompute "X分前に更新 / あとY時間でアイドル放棄" without needing a page reload.
    setInterval(refreshActiveTaskStatus, 60000);

    const renderEmbeddedFallback = () => {
      const embedded = document.getElementById("embedded-roadmap-data");
      if (!embedded || !embedded.textContent.trim()) return false;
      render(JSON.parse(embedded.textContent));
      return true;
    };

    const showLoadError = (error) => {
      app.innerHTML = `
        <main>
          <section class="load-error">
            <h1>Roadmap Viewer</h1>
            <p><code>roadmap.json</code>を自動で読み込めませんでした。下からJSONを選択してください。</p>
            <p class="meta">${escapeHtml(error.message || error)}</p>
            <input class="file-input" type="file" accept="application/json,.json" id="roadmap-file">
          </section>
        </main>`;
      document.getElementById("roadmap-file").addEventListener("change", async (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        render(JSON.parse(await file.text()));
      });
    };

    fetch("roadmap.json", { cache: "no-store" })
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then(render)
      .catch((error) => {
        if (!renderEmbeddedFallback()) showLoadError(error);
      });
  </script>
</body>
</html>
