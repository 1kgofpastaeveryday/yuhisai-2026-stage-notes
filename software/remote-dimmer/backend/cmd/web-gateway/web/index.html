<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f1f1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="照明リモート">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.png">
<title>照明リモート</title>
<link rel="stylesheet" href="./style.css">
<script src="./app.js" defer></script>
</head>
<body>
<main>
  <header><h1 id="fixture">照明リモート</h1><output id="percent" hidden>0<span>%</span></output></header>
  <p id="status" role="status">接続中</p>
  <section id="waiting"><p>端末ID</p><strong id="large-id"></strong></section>
  <section id="control" hidden>
    <div id="surface" role="slider" tabindex="0" aria-label="明るさ" aria-valuemin="0" aria-valuemax="255" aria-valuenow="0" aria-disabled="true"><div id="fill"></div></div>
    <div class="actions"><button id="off" disabled>消灯</button><button id="toggle" disabled>点灯</button></div>
  </section>
  <footer><span>端末ID <b id="device"></b></span><span id="connection">未接続</span><button id="fullscreen" type="button" aria-pressed="false">全画面表示</button></footer>
</main>
<dialog id="display-help" aria-labelledby="display-title"><h2 id="display-title">全画面で使う</h2><div id="install-help"><p>Safariの共有メニューから「ホーム画面に追加」し、追加したアイコンから開いてください。</p><p>通常表示に戻るには、Safariでこのリンクを開きます。</p></div><div id="native-start" hidden><p>全画面表示で操作を始めます。</p><button id="start-fullscreen">全画面で開く</button></div><button id="close-display">閉じる</button></dialog>
</body>
</html>
